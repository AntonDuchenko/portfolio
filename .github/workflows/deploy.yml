# Lints, builds and smoke-tests the site, then publishes it to GitHub Pages (branch gh-pages).
#
# One-time setup in the repository settings:
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch",
#   Branch: gh-pages / (root).
# Pages on a free plan needs a public repository.
#
# Flow: claude/** working branch → staging → main. A push to main publishes the live site
# (the root of gh-pages). A push to staging or a claude/** branch publishes a preview at
# preview/<branch>/ instead (staging: preview/staging/) — the live page never shows
# unmerged work. Previews are noindex and send no analytics; the next main deploy keeps
# them. Run it by hand from the Actions tab for any other branch.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, staging, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write          # push the built site to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 cannot install Chromium
    runs-on: ubuntu-24.04
    steps:
      # full checkout: the deploy action commits through a git worktree of this clone,
      # and a sparse checkout refuses the dist paths outside its cone
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint           # ESLint: type-aware rules + code style (eslint.config.js)
      - run: npm run typecheck      # app and tests
      - run: npm run build          # typecheck + bundle

      # smoke test of the built site (tests/): gate, scene → page, no-WebGL fallback,
      # linked files. A failure stops the deploy; the report is kept as an artifact.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Publish the live site (main)
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          single-commit: true       # keep gh-pages to one commit, no history bloat
          clean-exclude: preview    # branch previews survive a main deploy

      # a branch preview: hidden from search engines (it duplicates the live page)
      - name: Mark the preview noindex
        if: github.ref != 'refs/heads/main'
        run: sed -i 's/content="index, follow, max-image-preview:large"/content="noindex, nofollow"/' dist/index.html && grep -q 'noindex' dist/index.html
      - name: Publish a branch preview
        if: github.ref != 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: preview/${{ github.ref_name }}
